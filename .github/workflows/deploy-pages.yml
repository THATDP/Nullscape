name: Deploy frontend para GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do cliente
        working-directory: frontend
        run: npm ci

      - name: Testes do servidor (rápidos)
        working-directory: backend
        run: |
          npm ci
          npm run test:unit

      - name: Build de produção
        working-directory: frontend
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          echo "Servidor configurado: ${VITE_SERVER_URL:-<mesma origem>}"
          npm run build

      - name: Ajustes para GitHub Pages
        working-directory: frontend
        run: |
          # 404.html do SPA: preserva a navegação em links diretos
          cp dist/index.html dist/404.html
          # .nojekyll garante que pastas com _ (assets) sejam servidas
          touch dist/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload do artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
